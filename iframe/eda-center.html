<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EDA 工具中心</title>
	<link rel="stylesheet" href="/iframe/eda-tools.css">
</head>
<body data-eda-mode="catalog">
	<main id="catalogView">
		<div class="eda-toolbar">
			<label class="eda-search">
				<span>⌕</span>
				<input id="searchInput" type="search" placeholder="搜索工具、公式或应用场景…" autocomplete="off">
			</label>
			<div id="categoryTabs" class="eda-tabs" aria-label="工具分类"></div>
		</div>
		<div class="eda-catalog-meta"><span id="toolCount"></span><span>计算本地完成 · AI 需配置服务</span></div>
		<section id="recentSection" hidden>
			<h2>最近使用</h2>
			<div id="recentGrid" class="eda-grid eda-grid--recent"></div>
		</section>
		<p id="catalogError" role="alert" hidden></p><div id="catalogGroups"></div>
	</main>

	<script src="/iframe/eda-tools.bundle.js"></script>
</body>
</html>
